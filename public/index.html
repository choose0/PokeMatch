<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeMatch - 닮은꼴 포켓몬 찾기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>PokeMatch: 닮은꼴 포켓몬 찾기</h1>

  <!-- 사진 파일을 고르는 입력창 -->
  <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" />

  <!-- 고른 사진을 미리 보여줄 영역 -->
  <img id="preview" alt="미리보기" style="display: none;" />

  <!-- 오류 메시지를 보여줄 영역 -->
  <p id="error-message" style="display: none; color: red;"></p>

  <!-- 찾기 버튼: 브라우저 안에서 CLIP으로 사진을 분석해 닮은 포켓몬 3마리를 찾는다 -->
  <button id="find-button">닮은 포켓몬 찾기</button>

  <!-- 결과를 글자로 보여줄 영역 -->
  <div id="result"></div>

  <!-- app.js가 import문을 쓰므로 type="module"이 꼭 필요하다 -->
  <script type="module" src="app.js"></script>
</body>
</html>
